name: Deploy The Floor to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Calculate Dynamic Version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          BASE=6
          PATCH=$(( COMMITS >= BASE ? COMMITS - BASE : 0 ))
          VERSION="1.0.${PATCH}"
          echo "VITE_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Determined version: ${VERSION} from ${COMMITS} commits"
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
