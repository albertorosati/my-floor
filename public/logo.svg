<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="tileBg" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3b2269"/>
      <stop offset="70%" stop-color="#18112e"/>
      <stop offset="100%" stop-color="#0b0716"/>
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66B"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF5E00"/>
    </linearGradient>

    <linearGradient id="boltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF5E00"/>
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base 3D Tile -->
  <rect x="6" y="10" width="116" height="114" rx="28" fill="#0d0819"/>
  <rect x="6" y="6" width="116" height="114" rx="28" fill="url(#tileBg)" stroke="url(#goldRim)" stroke-width="4"/>

  <!-- 4 Illuminated Mini Floor Tiles -->
  <g opacity="0.6">
    <rect x="18" y="18" width="41" height="41" rx="10" fill="#00F0FF" opacity="0.4"/>
    <rect x="69" y="18" width="41" height="41" rx="10" fill="#FF007A" opacity="0.4"/>
    <rect x="18" y="69" width="41" height="41" rx="10" fill="#FF007A" opacity="0.4"/>
    <rect x="69" y="69" width="41" height="41" rx="10" fill="#FFB800" opacity="0.4"/>
  </g>

  <!-- Floor Grid Separator Lines -->
  <line x1="64" y1="14" x2="64" y2="114" stroke="#18112e" stroke-width="5"/>
  <line x1="14" y1="64" x2="114" y2="64" stroke="#18112e" stroke-width="5"/>

  <!-- High-Energy Central Lightning Bolt -->
  <g transform="translate(64, 62) scale(1.15)" filter="url(#neon)">
    <!-- Shadow -->
    <polygon points="4,-40 -20,2 -6,2 -18,38 20,-4 4,-4" fill="#000000" opacity="0.7" transform="translate(1, 2)"/>
    <!-- Bolt Face -->
    <polygon points="4,-40 -20,2 -6,2 -18,38 20,-4 4,-4" fill="url(#boltGold)" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
</svg>
