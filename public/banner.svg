<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b2269" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#18112e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0716" stop-opacity="1"/>
    </radialGradient>

    <!-- Gold Text 3D Gradients -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="18%" stop-color="#FFE66B"/>
      <stop offset="55%" stop-color="#FFB300"/>
      <stop offset="85%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D95000"/>
    </linearGradient>

    <linearGradient id="goldExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#732500"/>
      <stop offset="100%" stop-color="#240700"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF5E00"/>
    </linearGradient>

    <!-- Cyan & Magenta Accents -->
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <linearGradient id="tileGlow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#730037" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="tileGlow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00565C" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="tileGlow3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#735300" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#FF9D00" flood-opacity="0.3"/>
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="320" rx="28" fill="url(#bgGlow)"/>
  <rect width="960" height="320" rx="28" fill="none" stroke="#332252" stroke-width="2"/>

  <!-- Perspective Floor Grid (The Floor arena signature) -->
  <g opacity="0.45" transform="translate(0, 150)">
    <!-- Floor Grid Lines -->
    <polygon points="480,0 0,170 960,170" fill="none"/>
    <!-- Perspective radial lines -->
    <line x1="480" y1="0" x2="-80" y2="170" stroke="#4a317d" stroke-width="2"/>
    <line x1="480" y1="0" x2="80" y2="170" stroke="#4a317d" stroke-width="2"/>
    <line x1="480" y1="0" x2="240" y2="170" stroke="#4a317d" stroke-width="2"/>
    <line x1="480" y1="0" x2="400" y2="170" stroke="#5a3d99" stroke-width="2.5"/>
    <line x1="480" y1="0" x2="480" y2="170" stroke="#FFB800" stroke-width="3" opacity="0.7"/>
    <line x1="480" y1="0" x2="560" y2="170" stroke="#5a3d99" stroke-width="2.5"/>
    <line x1="480" y1="0" x2="720" y2="170" stroke="#4a317d" stroke-width="2"/>
    <line x1="480" y1="0" x2="880" y2="170" stroke="#4a317d" stroke-width="2"/>
    <line x1="480" y1="0" x2="1040" y2="170" stroke="#4a317d" stroke-width="2"/>

    <!-- Horizontal Floor Rings / Grids -->
    <line x1="380" y1="35" x2="580" y2="35" stroke="#4a317d" stroke-width="1.5"/>
    <line x1="280" y1="75" x2="680" y2="75" stroke="#4a317d" stroke-width="2"/>
    <line x1="140" y1="120" x2="820" y2="120" stroke="#5a3d99" stroke-width="2.5"/>
    <line x1="0" y1="168" x2="960" y2="168" stroke="#FF007A" stroke-width="3" opacity="0.6"/>

    <!-- Illuminated Floor Tiles -->
    <polygon points="440,55 520,55 540,85 420,85" fill="url(#tileGlow3)"/>
    <polygon points="310,95 430,95 410,135 270,135" fill="url(#tileGlow2)"/>
    <polygon points="530,95 650,95 690,135 550,135" fill="url(#tileGlow1)"/>
  </g>

  <!-- Top Badge: TV SHOW FORMAT // VOICE ARENA -->
  <g transform="translate(480, 48)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#181129" stroke="url(#cyanPill)" stroke-width="2"/>
    <text x="0" y="5" font-family="'Arial Black', 'Impact', sans-serif" font-size="11" font-weight="900" fill="#00F0FF" letter-spacing="4" text-anchor="middle">
      1v1 VOICE DUEL SHOWDOWN
    </text>
  </g>

  <!-- Central 3D Logo: THE FLOOR -->
  <g filter="url(#shadow3d)" transform="translate(480, 150)">
    <!-- 3D Extrusion Shadows (Layered for tactile depth) -->
    <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="106" letter-spacing="6" text-anchor="middle">
      <text x="0" y="16" fill="#150600">THE FLOOR</text>
      <text x="0" y="14" fill="#300d00">THE FLOOR</text>
      <text x="0" y="12" fill="#521600">THE FLOOR</text>
      <text x="0" y="10" fill="#7a2100">THE FLOOR</text>
      <text x="0" y="8" fill="#a82d00">THE FLOOR</text>
      <text x="0" y="6" fill="#cc3700">THE FLOOR</text>
      <text x="0" y="4" fill="#e64200">THE FLOOR</text>
      <text x="0" y="2" fill="#ff5e00">THE FLOOR</text>

      <!-- Main Glowing Gold Face -->
      <text x="0" y="0" fill="url(#goldFace)" stroke="#181226" stroke-width="4">THE FLOOR</text>
    </g>

    <!-- Electric Lightning Bolt (Center Overlap) -->
    <g transform="translate(-155, -78) scale(1.15)" filter="url(#neonGlow)">
      <!-- Bolt Shadow -->
      <polygon points="26,0 4,36 18,36 6,66 40,24 24,24" fill="#181226" transform="translate(2, 3)"/>
      <!-- Bolt Face -->
      <polygon points="26,0 4,36 18,36 6,66 40,24 24,24" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>

  <!-- Bottom Badges / Feature Highlights Ribbon -->
  <g transform="translate(480, 252)">
    <!-- Feature Pill 1: Web Speech Engine -->
    <g transform="translate(-270, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#181129" stroke="#FF007A" stroke-width="2"/>
      <circle cx="-82" cy="0" r="5" fill="#FF007A" filter="url(#neonGlow)"/>
      <text x="-70" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFDF0">
        Sub-100ms Voice Engine
      </text>
    </g>

    <!-- Feature Pill 2: 56 Categories & 2,100+ HD Photos -->
    <g transform="translate(0, 0)">
      <rect x="-125" y="-16" width="250" height="32" rx="16" fill="#181129" stroke="#FFB800" stroke-width="2"/>
      <circle cx="-102" cy="0" r="5" fill="#FFB800" filter="url(#neonGlow)"/>
      <text x="-90" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFDF0">
        56 Categories • 2,100+ HD Photos
      </text>
    </g>

    <!-- Feature Pill 3: Discord Companion P2P -->
    <g transform="translate(270, 0)">
      <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#181129" stroke="#00F0FF" stroke-width="2"/>
      <circle cx="-82" cy="0" r="5" fill="#00F0FF" filter="url(#neonGlow)"/>
      <text x="-70" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFDF0">
        Discord P2P Remote Mic
      </text>
    </g>
  </g>
</svg>
